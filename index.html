<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora iPhone 27.2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .calculator {
            width: 380px;
            background: #000;
            border-radius: 45px;
            padding: 25px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
        }

        .display {
            background: #000;
            color: #fff;
            font-size: 72px;
            font-weight: 300;
            text-align: right;
            padding: 30px 20px;
            margin-bottom: 20px;
            border-radius: 20px;
            min-height: 120px;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            overflow: hidden;
            word-wrap: break-word;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            border: none;
            border-radius: 50%;
            font-size: 32px;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.2s;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:active {
            transform: scale(0.95);
            opacity: 0.7;
        }

        .number, .decimal {
            background: #333;
            color: #fff;
        }

        .number:hover, .decimal:hover {
            background: #4a4a4a;
        }

        .operator {
            background: #ff9f0a;
            color: #fff;
            font-size: 38px;
        }

        .operator:hover {
            background: #ffb340;
        }

        .operator.active {
            background: #fff;
            color: #ff9f0a;
        }

        .function {
            background: #a6a6a6;
            color: #000;
            font-size: 28px;
        }

        .function:hover {
            background: #d4d4d4;
        }

        .zero {
            grid-column: span 2;
            border-radius: 50px;
            justify-content: flex-start;
            padding-left: 32px;
        }

        .special-function {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            font-size: 24px;
        }

        .special-function:hover {
            background: linear-gradient(135deg, #7c8ff0 0%, #8a5bb8 100%);
        }

        @media (max-width: 420px) {
            .calculator {
                width: 95%;
                padding: 20px;
            }

            .display {
                font-size: 56px;
                min-height: 100px;
            }

            button {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display" id="display">0</div>
        <div class="buttons">
            <button class="function" onclick="clearAll()">AC</button>
            <button class="function" onclick="toggleSign()">+/-</button>
            <button class="function" onclick="percentage()">%</button>
            <button class="operator" onclick="setOperator('÷')">÷</button>

            <button class="number" onclick="appendNumber('7')">7</button>
            <button class="number" onclick="appendNumber('8')">8</button>
            <button class="number" onclick="appendNumber('9')">9</button>
            <button class="operator" onclick="setOperator('×')">×</button>

            <button class="number" onclick="appendNumber('4')">4</button>
            <button class="number" onclick="appendNumber('5')">5</button>
            <button class="number" onclick="appendNumber('6')">6</button>
            <button class="operator" onclick="setOperator('−')">−</button>

            <button class="number" onclick="appendNumber('1')">1</button>
            <button class="number" onclick="appendNumber('2')">2</button>
            <button class="number" onclick="appendNumber('3')">3</button>
            <button class="operator" onclick="setOperator('+')">+</button>

            <button class="number zero" onclick="appendNumber('0')">0</button>
            <button class="decimal" onclick="appendDecimal()">,</button>
            <button class="operator" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        let currentValue = '0';
        let previousValue = null;
        let operator = null;
        let shouldResetDisplay = false;

        const display = document.getElementById('display');

        function updateDisplay() {
            const formatted = parseFloat(currentValue).toLocaleString('pt-BR', {
                maximumFractionDigits: 9
            });
            display.textContent = currentValue.includes('.') && currentValue.endsWith('.') 
                ? formatted + ',' 
                : formatted.replace('.', ',');
        }

        function appendNumber(num) {
            if (shouldResetDisplay) {
                currentValue = num;
                shouldResetDisplay = false;
            } else {
                currentValue = currentValue === '0' ? num : currentValue + num;
            }
            updateDisplay();
        }

        function appendDecimal() {
            if (shouldResetDisplay) {
                currentValue = '0.';
                shouldResetDisplay = false;
            } else if (!currentValue.includes('.')) {
                currentValue += '.';
            }
            updateDisplay();
        }

        function clearAll() {
            currentValue = '0';
            previousValue = null;
            operator = null;
            shouldResetDisplay = false;
            removeActiveOperator();
            updateDisplay();
        }

        function toggleSign() {
            currentValue = (parseFloat(currentValue) * -1).toString();
            updateDisplay();
        }

        function percentage() {
            currentValue = (parseFloat(currentValue) / 100).toString();
            updateDisplay();
        }

        function setOperator(op) {
            if (operator !== null && !shouldResetDisplay) {
                calculate();
            }
            previousValue = currentValue;
            operator = op;
            shouldResetDisplay = true;
            
            removeActiveOperator();
            const operators = document.querySelectorAll('.operator');
            operators.forEach(btn => {
                if (btn.textContent === op) {
                    btn.classList.add('active');
                }
            });
        }

        function removeActiveOperator() {
            document.querySelectorAll('.operator').forEach(btn => {
                btn.classList.remove('active');
            });
        }

        function calculate() {
            if (operator === null || previousValue === null) return;

            const prev = parseFloat(previousValue);
            const current = parseFloat(currentValue);
            let result;

            switch (operator) {
                case '+':
                    result = prev + current;
                    break;
                case '−':
                    result = prev - current;
                    break;
                case '×':
                    result = prev * current;
                    break;
                case '÷':
                    result = current !== 0 ? prev / current : 'Erro';
                    break;
                default:
                    return;
            }

            currentValue = result.toString();
            operator = null;
            previousValue = null;
            shouldResetDisplay = true;
            removeActiveOperator();
            updateDisplay();
        }

        // Suporte para teclado
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
            if (e.key === '.') appendDecimal();
            if (e.key === '+') setOperator('+');
            if (e.key === '-') setOperator('−');
            if (e.key === '*') setOperator('×');
            if (e.key === '/') { e.preventDefault(); setOperator('÷'); }
            if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); calculate(); }
            if (e.key === 'Escape') clearAll();
            if (e.key === '%') percentage();
        });

        updateDisplay();
    </script>
</body>
</html>
